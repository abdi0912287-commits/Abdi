
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use preinstalled Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

      - run: npm install

      - name: Copy fonts into app (offline use)
        run: |
          mkdir -p www/fonts
          cp -r node_modules/@fontsource/vazirmatn www/fonts/vazirmatn
          cp -r node_modules/@fontsource/roboto-slab www/fonts/roboto-slab

      - run: npx cap add android

      - name: Generate Android App Icon
        run: |
          npm install --no-save @capacitor/assets
          cp assets/icon-only.png assets/icon.png
          npx capacitor-assets generate --android --assetPath assets

      - run: npx cap sync android

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: backgammon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
