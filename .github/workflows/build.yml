name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install

      - name: Copy fonts into app
        run: |
          mkdir -p www/fonts
          cp -r node_modules/@fontsource/vazirmatn www/fonts/vazirmatn
          cp -r node_modules/@fontsource/roboto-slab www/fonts/roboto-slab

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - run: npx cap add android

      - run: npx cap sync android

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap build android \
            --androidreleasetype APK \
            --keystorepath "$GITHUB_WORKSPACE/release-key.jks" \
            --keystorepass "$KEYSTORE_PASSWORD" \
            --keystorealias "$KEY_ALIAS" \
            --keystorealiaspass "$KEY_PASSWORD"

      - uses: actions/upload-artifact@v4
        with:
          name: backgammon-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
