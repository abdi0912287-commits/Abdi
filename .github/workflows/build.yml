name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Copy fonts
        run: |
          mkdir -p www/fonts
          cp -r node_modules/@fontsource/vazirmatn www/fonts/vazirmatn
          cp -r node_modules/@fontsource/roboto-slab www/fonts/roboto-slab

      - name: Decode release key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build signed Release APK
        run: |
          npx cap build android \
            --androidreleasetype APK \
            --keystorepath "$GITHUB_WORKSPACE/release-key.jks" \
            --keystorepass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --keystorealias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --keystorealiaspass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: backgammon-release-apk
          path: android/app/build/outputs/apk/release/*-signed.apk
